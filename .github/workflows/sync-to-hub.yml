name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  # Allows manually running this workflow from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://ganganimaulik:$HF_TOKEN@huggingface.co/spaces/ganganimaulik/diet-maker-worker
          git push --force hf HEAD:refs/heads/main
