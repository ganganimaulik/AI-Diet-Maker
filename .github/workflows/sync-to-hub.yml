name: Sync to Hugging Face Spaces

on:
  # Auto-sync to Hugging Face disabled after migrating the worker to the GCP VM
  # (prevents double-deploys fighting over the shared WhatsApp session).
  # Kept for manual use only: Actions tab -> Run workflow.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://ganganimaulik:$HF_TOKEN@huggingface.co/spaces/ganganimaulik/diet-maker-worker
          git push --force hf HEAD:refs/heads/main
